<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Device Display Test</title>
<style>
  :root {
    --device-radius: 16px;
    --accent: #7aa7ff;
    --accent-text: #0b0d12;
    color-scheme: dark;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: #101014; color: #e8e8ea;
    max-width: 520px; margin: 0 auto;
    padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right))
             24px max(14px, env(safe-area-inset-left));
  }
  h1 { font-size: 17px; margin-bottom: 2px; color: #fff; }
  #summary { font-size: 12.5px; color: #999; margin-bottom: 8px; }
  #summary b { color: var(--accent); }

  .lbl { font-size: 10.5px; color: #777; text-transform: uppercase; letter-spacing: .06em; margin: 10px 0 5px; }
  table { border-collapse: collapse; font-size: 12px; width: 100%; }
  td { border: 1px solid #2c2c33; padding: 4px 8px; vertical-align: top; }
  td:first-child { background: #191920; width: 38%; color: #aaa; white-space: nowrap; }
  td:last-child { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; color: #ddd; word-break: break-word; }

  .icons { display: flex; gap: 10px; }
  .icon-tile {
    width: 46px; height: 46px; background: #191920; border: 1px solid #33333c;
    border-radius: calc(var(--device-radius) * 0.45);
    display: flex; align-items: center; justify-content: center;
  }
  .icon-tile svg { width: 22px; height: 22px; stroke: #e8e8ea; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  #sheet {
    position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 10;
    background: #15151b; border: 1px solid #3a3a44; padding: 13px 15px;
    border-radius: 16px 16px max(0px, calc(var(--device-radius) - 12px)) max(0px, calc(var(--device-radius) - 12px));
  }
  #sheet h2 { font-size: 14px; margin-bottom: 2px; color: #fff; }
  #sheetInfo { font-size: 11px; color: var(--accent); font-family: ui-monospace, Menlo, Consolas, monospace; margin-bottom: 9px; }
  .row { display: flex; gap: 10px; }
  button.btn {
    font-size: 15px; padding: 10px 18px;
    border: 1px solid var(--accent); background: transparent; color: #e8e8ea;
    border-radius: calc(var(--device-radius) * 0.45);
  }
  button.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

  /* Continuous-curvature corners (matches OEM squircle screens);
     falls back to circular border-radius automatically. */
  @supports (corner-shape: squircle) {
    button.btn, .icon-tile, #sheet { corner-shape: squircle; }
  }
</style>
</head>
<body>

<h1>Device Display Test</h1>
<p id="summary">Detecting…</p>

<p class="lbl">Detection</p>
<table id="info"></table>

<p class="lbl">Icons — radius × 0.45</p>
<div class="icons">
  <div class="icon-tile"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg></div>
  <div class="icon-tile"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M15.5 15.5 20 20"/></svg></div>
  <div class="icon-tile"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.3-8.7-8.5C2 8 3.8 5 6.9 5c1.9 0 3.5 1 4.1 2.6C11.6 6 13.2 5 15.1 5c3.1 0 4.9 3 3.6 6.5C17 15.7 12 20 12 20z"/></svg></div>
  <div class="icon-tile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.7-3.6 3.5-5.4 7-5.4s6.3 1.8 7 5.4"/></svg></div>
</div>

<div id="sheet">
  <h2>Bottom Sheet</h2>
  <p id="sheetInfo"></p>
  <div class="row">
    <button class="btn primary">Primary</button>
    <button class="btn">Secondary</button>
  </div>
</div>

<!-- device-corners.js must sit next to this file (or adjust the path) -->
<script src="device-corners.js"></script>
<script>
/* ================= page code (uses device-corners.js) ================= */
var DC = (typeof DeviceCorners !== 'undefined') ? DeviceCorners : null;

function getPlatform() {
  var ua = navigator.userAgent;
  if (/iPhone|iPod/.test(ua)) return 'iOS (iPhone)';
  if (/iPad/.test(ua)) return 'iPadOS';
  if (/Android/.test(ua)) return 'Android';
  if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) return 'iPadOS';
  return 'Desktop';
}
function getBrowser() {
  var ua = navigator.userAgent;
  if (/CriOS\//.test(ua)) return 'Chrome on iOS (WebKit)';
  if (/FxiOS\//.test(ua)) return 'Firefox on iOS (WebKit)';
  if (/SamsungBrowser\//.test(ua)) return 'Samsung Internet (Blink)';
  if (/MiuiBrowser|XiaoMi\//.test(ua)) return 'MIUI Browser (Blink)';
  if (/HuaweiBrowser\//.test(ua)) return 'Huawei Browser (Blink)';
  if (/HeyTapBrowser|OppoBrowser/.test(ua)) return 'OPPO Browser (Blink)';
  if (/VivoBrowser/.test(ua)) return 'vivo Browser (Blink)';
  if (/Edg\//.test(ua)) return 'Edge (Blink)';
  if (/OPR\//.test(ua)) return 'Opera (Blink)';
  if (/Firefox\//.test(ua)) return 'Firefox (Gecko)';
  if (/Chrome\//.test(ua)) return 'Chrome (Blink)';
  if (/Safari\//.test(ua)) return 'Safari (WebKit)';
  return 'Unknown';
}

/* ---------- safe-area insets ---------- */
function safeArea() {
  var el = document.createElement('div');
  el.style.cssText = 'position:fixed;left:-9999px;top:-9999px;' +
    'padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);' +
    'padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);';
  document.body.appendChild(el);
  var cs = getComputedStyle(el);
  var v = ['Top', 'Right', 'Bottom', 'Left'].map(function (s) { return parseFloat(cs['padding' + s]) || 0; });
  document.body.removeChild(el);
  return v;
}

/* ---------- color scheme / gamut ---------- */
function colorScheme() {
  try {
    if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
    if (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) return 'light';
  } catch (e) {}
  return 'unknown';
}
function colorGamut() {
  try {
    if (matchMedia('(color-gamut: rec2020)').matches) return 'rec2020';
    if (matchMedia('(color-gamut: p3)').matches) return 'p3';
    if (matchMedia('(color-gamut: srgb)').matches) return 'srgb';
  } catch (e) {}
  return 'unknown';
}

/* ---------- state ---------- */
var state = {
  platform: getPlatform(),
  browser: getBrowser(),
  model: '',
  deviceName: '',
  brand: '',
  source: '',
  radius: 16,
  exact: false,
  curve: 'squircle',
  mq: DC ? DC.radiusMediaQuerySupported() : false,
  battery: 'checking…'
};

/* ---------- render ---------- */
function render() {
  var dpr = window.devicePixelRatio || 1;
  var sa = safeArea();
  var modelText = state.model
    ? (state.deviceName ? state.model + ' · ' + state.deviceName : state.model)
    : (state.platform === 'Android' ? '(detecting…)' : 'not exposed');

  var rows = [
    ['Platform', state.platform],
    ['Browser', state.browser],
    ['Model', modelText],
    ['Screen', screen.width + ' × ' + screen.height + ' px @ ' + dpr + 'x'],
    ['Safe-area t/r/b/l', sa[0] + ' / ' + sa[1] + ' / ' + sa[2] + ' / ' + sa[3] + ' px'],
    ['radius media query', state.mq ? 'supported' : 'not supported'],
    ['Source', state.source || '—'],
    ['Corner radius', (state.exact ? '' : '~') + state.radius + ' px — ' + (state.exact ? 'exact' : 'estimated/default')],
    ['Corner shape', state.curve + ' · CSS corner-shape: ' + (DC && DC.supportsSquircle() ? 'yes' : 'no')],
    ['Color scheme', colorScheme() + ' (system)'],
    ['Color gamut', colorGamut()],
    ['Battery', state.battery]
  ];
  document.getElementById('info').innerHTML =
    rows.map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('');

  document.documentElement.style.setProperty('--device-radius', state.radius + 'px');
  document.getElementById('summary').innerHTML =
    'Applied corner radius: <b>' + (state.exact ? '' : '~') + state.radius + 'px</b> (' +
    (state.exact ? 'exact' : 'estimated') + ')';
  document.getElementById('sheetInfo').textContent =
    'bottom corners: ' + state.radius + '−12 = ' + Math.max(state.radius - 12, 0) +
    'px · buttons: ' + (state.radius * 0.45).toFixed(1) + 'px';
  document.body.style.paddingBottom = (document.getElementById('sheet').offsetHeight + 20) + 'px';
}

/* ---------- init ---------- */
render();

if (DC) {
  DC.detect().then(function (res) {
    state.radius = res.radius;
    state.exact = res.exact;
    state.curve = res.curve;
    state.source = res.source === 'model-database' ? 'model database · ' + res.device
      : res.source === 'brand-default' ? 'brand default · ' + res.brand
      : res.source === 'ios-size-table' ? 'iOS screen-size table'
      : res.source === 'media-query' ? 'CSS radius media query'
      : res.source;
    state.model = res.model || '';
    state.deviceName = res.device || '';
    state.brand = res.brand || '';
    render();
  });
}

/* live listeners */
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render); } catch (e) {}
window.addEventListener('resize', render);

/* battery (Chrome / Samsung Internet on Android; not on iOS Safari) */
if (navigator.getBattery) {
  navigator.getBattery().then(function (b) {
    var upd = function () {
      state.battery = Math.round(b.level * 100) + '% · ' + (b.charging ? 'charging' : 'discharging');
      render();
    };
    b.addEventListener('levelchange', upd);
    b.addEventListener('chargingchange', upd);
    upd();
  }).catch(function () { state.battery = 'not exposed'; render(); });
} else {
  state.battery = 'not exposed';
  render();
}
</script>
</body>
</html>
