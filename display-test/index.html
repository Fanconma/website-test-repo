<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Device Display Test</title>
<style>
  :root {
    --device-radius: 16px;
    --accent: #7aa7ff;
    --accent-text: #0b0d12;
    color-scheme: dark;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: #101014; color: #e8e8ea;
    max-width: 520px; margin: 0 auto;
    padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right))
             24px max(14px, env(safe-area-inset-left));
  }
  h1 { font-size: 17px; margin-bottom: 2px; color: #fff; }
  #summary { font-size: 12.5px; color: #999; margin-bottom: 8px; }
  #summary b { color: var(--accent); }

  .lbl { font-size: 10.5px; color: #777; text-transform: uppercase; letter-spacing: .06em; margin: 10px 0 5px; }
  table { border-collapse: collapse; font-size: 12px; width: 100%; }
  td { border: 1px solid #2c2c33; padding: 4px 8px; vertical-align: top; }
  td:first-child { background: #191920; width: 38%; color: #aaa; white-space: nowrap; }
  td:last-child { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; color: #ddd; word-break: break-word; }

  .icons { display: flex; gap: 10px; }
  .icon-tile {
    width: 46px; height: 46px; background: #191920; border: 1px solid #33333c;
    border-radius: calc(var(--device-radius) * 0.45);
    display: flex; align-items: center; justify-content: center;
  }
  .icon-tile svg { width: 22px; height: 22px; stroke: #e8e8ea; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  #hdrCanvas, canvas.hdrfb {
    display: block; width: 100%;
    border: 1px solid #3a3a44; border-radius: calc(var(--device-radius) * 0.3);
    background: #101014;
  }

  #sheet {
    position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 10;
    background: #15151b; border: 1px solid #3a3a44; padding: 13px 15px;
    border-radius: 16px 16px max(0px, calc(var(--device-radius) - 12px)) max(0px, calc(var(--device-radius) - 12px));
  }
  #sheet h2 { font-size: 14px; margin-bottom: 2px; color: #fff; }
  #sheetInfo { font-size: 11px; color: var(--accent); font-family: ui-monospace, Menlo, Consolas, monospace; margin-bottom: 9px; }
  .row { display: flex; gap: 10px; }
  button.btn {
    font-size: 15px; padding: 10px 18px;
    border: 1px solid var(--accent); background: transparent; color: #e8e8ea;
    border-radius: calc(var(--device-radius) * 0.45);
  }
  button.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

  /* Continuous-curvature corners (matches OEM squircle screens);
     falls back to circular border-radius automatically. */
  @supports (corner-shape: squircle) {
    button.btn, .icon-tile, #sheet { corner-shape: squircle; }
  }
</style>
</head>
<body>

<h1>Device Display Test</h1>
<p id="summary">Detecting…</p>

<p class="lbl">Detection</p>
<table id="info"></table>

<p class="lbl">Icons — radius × 0.45</p>
<div class="icons">
  <div class="icon-tile"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg></div>
  <div class="icon-tile"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M15.5 15.5 20 20"/></svg></div>
  <div class="icon-tile"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.3-8.7-8.5C2 8 3.8 5 6.9 5c1.9 0 3.5 1 4.1 2.6C11.6 6 13.2 5 15.1 5c3.1 0 4.9 3 3.6 6.5C17 15.7 12 20 12 20z"/></svg></div>
  <div class="icon-tile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.7-3.6 3.5-5.4 7-5.4s6.3 1.8 7 5.4"/></svg></div>
</div>

<p class="lbl">HDR</p>
<canvas id="hdrCanvas"></canvas>

<div id="sheet">
  <h2>Bottom Sheet</h2>
  <p id="sheetInfo"></p>
  <div class="row">
    <button class="btn primary">Primary</button>
    <button class="btn">Secondary</button>
  </div>
</div>

<script>
/* ---------- platform / browser ---------- */
function getPlatform() {
  var ua = navigator.userAgent;
  if (/iPhone|iPod/.test(ua)) return 'iOS (iPhone)';
  if (/iPad/.test(ua)) return 'iPadOS';
  if (/Android/.test(ua)) return 'Android';
  if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) return 'iPadOS';
  return 'Desktop';
}
function getBrowser() {
  var ua = navigator.userAgent;
  if (/CriOS\//.test(ua)) return 'Chrome on iOS (WebKit)';
  if (/FxiOS\//.test(ua)) return 'Firefox on iOS (WebKit)';
  if (/SamsungBrowser\//.test(ua)) return 'Samsung Internet (Blink)';
  if (/MiuiBrowser|XiaoMi\//.test(ua)) return 'MIUI Browser (Blink)';
  if (/HuaweiBrowser\//.test(ua)) return 'Huawei Browser (Blink)';
  if (/HeyTapBrowser|OppoBrowser/.test(ua)) return 'OPPO Browser (Blink)';
  if (/VivoBrowser/.test(ua)) return 'vivo Browser (Blink)';
  if (/Edg\//.test(ua)) return 'Edge (Blink)';
  if (/OPR\//.test(ua)) return 'Opera (Blink)';
  if (/Firefox\//.test(ua)) return 'Firefox (Gecko)';
  if (/Chrome\//.test(ua)) return 'Chrome (Blink)';
  if (/Safari\//.test(ua)) return 'Safari (WebKit)';
  return 'Unknown';
}

/* ---------- radius: CSS media query (Safari 16.4+, exact) ---------- */
function mqSupported() {
  try { return !!(window.matchMedia && matchMedia('(min-radius: 0px)').matches); } catch (e) { return false; }
}
function radiusByMQ() {
  try {
    if (!mqSupported()) return null;
    if (!matchMedia('(radius)').matches) return 0;
    var lo = 0, hi = 140;
    for (var i = 0; i < 18; i++) {
      var mid = (lo + hi) / 2;
      if (matchMedia('(min-radius: ' + mid + 'px)').matches) lo = mid; else hi = mid;
    }
    var KNOWN = [39, 41.5, 44, 47.33, 53.33, 55, 62];
    var snap = KNOWN.find(function (k) { return Math.abs(k - lo) < 1.2; });
    return snap !== undefined ? snap : Math.round(lo * 100) / 100;
  } catch (e) { return null; }
}

/* ---------- radius: iOS screen-size table (fallback) ---------- */
var IOS_TABLE = {
  '375x812@3': 44, '414x896@3': 39, '414x896@2': 41.5, '390x844@3': 47.33,
  '428x926@3': 53.33, '393x852@3': 55, '430x932@3': 55,
  '402x874@3': 62, '440x956@3': 62, '420x912@3': 62
};
function radiusByIOSSize() {
  if (!/iPhone|iPod/.test(navigator.userAgent)) return null;
  var w = Math.min(screen.width, screen.height), h = Math.max(screen.width, screen.height);
  var r = IOS_TABLE[w + 'x' + h + '@' + (window.devicePixelRatio || 1)];
  if (r === 44 && !/OS 1[7-9]/.test(navigator.userAgent)) r = 39;
  return r !== undefined ? r : null;
}

/* ---------- Android model database ----------
   Radius values are BASE radii in dp for continuous-curvature (squircle)
   corners. Model codes verified against the MobileModels database
   (github.com/luckyzyx/MobileModels); prefixes cover CN/Global/India
   variants. Values are initial estimates - refine from tester
   screenshots (MIUI/HyperOS bakes the rounded mask into screenshots,
   see screenshot-radius.py). Pre-2023 Xiaomi/Redmi falls back to the
   unified brand default. POCO rebrands share Redmi codes.          */
var ANDROID_MODELS = [
  /* Xiaomi numbered flagships */
  { p: '23127PN0', n: 'Xiaomi 14',            r: 44 },
  { p: '23116PN5', n: 'Xiaomi 14 Pro',        r: 46 },
  { p: '2311BPN2', n: 'Xiaomi 14 Pro Ti',     r: 46 },
  { p: '24030PN6', n: 'Xiaomi 14 Ultra',      r: 46 },
  { p: '24031PN0', n: 'Xiaomi 14 Ultra',      r: 46 },
  { p: '2406APNF', n: 'Xiaomi 14T',           r: 44 },
  { p: '2407FPN8', n: 'Xiaomi 14T Pro',       r: 46 },
  { p: '24129PN7', n: 'Xiaomi 15',            r: 46 },
  { p: '24101PNB', n: 'Xiaomi 15 Pro',        r: 48 },
  { p: '2410DPN6', n: 'Xiaomi 15 Pro',        r: 48 },
  { p: '25010PN3', n: 'Xiaomi 15 Ultra',      r: 48 },
  { p: '25019PNF', n: 'Xiaomi 15 Ultra',      r: 48 },
  { p: '25042PN2', n: 'Xiaomi 15S Pro',       r: 48 },
  { p: '25069PTE', n: 'Xiaomi 15T',           r: 46 },
  { p: '2506BPN6', n: 'Xiaomi 15T Pro',       r: 48 },
  { p: '25113PN0', n: 'Xiaomi 17',            r: 48 },
  { p: '25098PN5', n: 'Xiaomi 17 Pro',        r: 50 },
  { p: '2509FPN0', n: 'Xiaomi 17 Pro Max',    r: 50 },
  { p: '2512BPND', n: 'Xiaomi 17 Ultra',      r: 50 },
  { p: '25128PNA', n: 'Xiaomi 17 Ultra',      r: 50 },
  { p: '2605EPN8', n: 'Xiaomi 17 Max',        r: 46 },
  { p: '2602DPT5', n: 'Xiaomi 17T',           r: 48 },
  { p: 'M531DA',   n: 'Xiaomi 17T',           r: 48 },
  { p: '2602EPTC', n: 'Xiaomi 17T Pro',       r: 50 },
  { p: 'M025EC',   n: 'Xiaomi 17T Pro',       r: 50 },
  /* Xiaomi Civi / MIX fold & flip */
  { p: '24053PY0', n: 'Xiaomi Civi 4 Pro',    r: 44 },
  { p: '25067PYE', n: 'Xiaomi Civi 5 Pro',    r: 44 },
  { p: '2308CPXD', n: 'Xiaomi MIX Fold 3',    r: 18 },
  { p: '24072PX7', n: 'Xiaomi MIX Fold 4',    r: 18 },
  { p: '2405CPX3', n: 'Xiaomi MIX Flip',      r: 40 },
  { p: '2505APX7', n: 'Xiaomi MIX Flip 2',    r: 40 },
  /* Redmi K series */
  { p: '23113RKC', n: 'Redmi K70',            r: 40 },
  { p: '23117RK6', n: 'Redmi K70 Pro',        r: 42 },
  { p: '2311DRK4', n: 'Redmi K70E',           r: 36 },
  { p: '2407FRK8', n: 'Redmi K70 Ultra',      r: 42 },
  { p: '24117RK2', n: 'Redmi K80',            r: 42 },

  { p: '2510DRK4', n: 'Redmi K90',            r: 44 },
  { p: '25102RKB', n: 'Redmi K90 Pro Max',    r: 46 },
  { p: '25102RK6', n: 'Redmi K90 Pro Max',    r: 46 },
  { p: '2604FRK1', n: 'Redmi K90 Max',        r: 46 },
  /* Redmi Turbo series */
  { p: '24069RA2', n: 'Redmi Turbo 3',        r: 38 },
  { p: '24129RT7', n: 'Redmi Turbo 4',        r: 40 },
  { p: '25053RT4', n: 'Redmi Turbo 4 Pro',    r: 42 },
  { p: '2511FRT3', n: 'Redmi Turbo 5',        r: 42 },
  { p: '2606FRT3', n: 'Redmi Turbo 5',        r: 42 },
  { p: '2602BRT1', n: 'Redmi Turbo 5 Max',    r: 44 },
  /* Redmi Note 13 series (2023-) */
  { p: '23129RAA', n: 'Redmi Note 13',        r: 30 },
  { p: '23129RA5', n: 'Redmi Note 13',        r: 30 },
  { p: '23124RA7', n: 'Redmi Note 13',        r: 30 },

  { p: '2406ERN9', n: 'Redmi Note 13R',       r: 32 },

  /* Redmi Note 14 series */
  { p: '24117RN7', n: 'Redmi Note 14',        r: 32 },
  { p: '24094RAD', n: 'Redmi Note 14 5G',     r: 32 },
  { p: '2502FRA6', n: 'Redmi Note 14S',       r: 36 },
  { p: '24116RAC', n: 'Redmi Note 14 Pro',    r: 38 },
  { p: '24090RA2', n: 'Redmi Note 14 Pro 5G', r: 38 },
  { p: '24115RA8', n: 'Redmi Note 14 Pro+',   r: 40 },
  /* Redmi Note 15 series */
  { p: '2510DRA2', n: 'Redmi Note 15',        r: 34 },
  { p: '25098RA9', n: 'Redmi Note 15 5G',     r: 34 },
  { p: '26022PCA', n: 'Redmi Note 15 SE 5G',  r: 34 },
  { p: '25100RA6', n: 'Redmi Note 15 Pro',    r: 40 },
  { p: '25080RAB', n: 'Redmi Note 15 Pro 5G', r: 40 },
  { p: '2510ERA8', n: 'Redmi Note 15 Pro+',   r: 42 },
  { p: '25104RAD', n: 'Redmi Note 15 Pro+',   r: 42 },
  { p: '25057RA0', n: 'Redmi Note 15R',       r: 34 },
  /* Redmi budget line (unified) */
  { p: '2404ARN4', n: 'Redmi 13',             r: 30 },
  { p: '24049RN2', n: 'Redmi 13',             r: 30 },
  { p: '24040RN6', n: 'Redmi 13',             r: 30 },
  { p: '23106RN0', n: 'Redmi 13C',            r: 28 },
  { p: '2311DRN1', n: 'Redmi 13C',            r: 28 },
  { p: '23100RN8', n: 'Redmi 13C',            r: 28 },
  { p: '23108RN0', n: 'Redmi 13C',            r: 28 },
  { p: '23124RN8', n: 'Redmi 13C 5G',         r: 28 },
  { p: '2409BRN2', n: 'Redmi 14C',            r: 28 },
  { p: '2411DRN4', n: 'Redmi 14C 5G',         r: 28 },
  { p: '25062RN2', n: 'Redmi 15',             r: 30 },
  { p: '25057RN0', n: 'Redmi 15 5G',          r: 30 },
  { p: '25078RA3', n: 'Redmi 15C',            r: 28 },
  { p: '2508CRN2', n: 'Redmi 15C 5G',         r: 28 },
  { p: '25082RNC', n: 'Redmi 15R 5G',         r: 28 },
  { p: '2602BRNA', n: 'Redmi 15A 5G',         r: 28 }
];
/* unified fallback: pre-2023 Xiaomi/Redmi + other brands */
var BRAND_DEFAULTS = {
  'samsung': 30, 'samsung-ultra': 16, 'samsung-fold': 14,
  'xiaomi': 44, 'redmi': 32,
  'huawei': 36,
  'oppo': 40, 'oneplus': 40,
  'vivo': 36,
  'pixel': 18
};
var cssWidth = Math.min(screen.width, screen.height);

function lookupAndroidModel(model) {
  var m = (model || '').toUpperCase();
  if (!m) return null;
  for (var i = 0; i < ANDROID_MODELS.length; i++) {
    if (m.indexOf(ANDROID_MODELS[i].p) === 0) return ANDROID_MODELS[i];
  }
  return null;
}

function brandOfModel(model) {
  var m = model.toUpperCase();
  if (/^PIXEL/.test(m)) return 'pixel';
  if (/^SM-F/.test(m)) return 'samsung-fold';
  if (/^SM-S\d\d8/.test(m)) return 'samsung-ultra';
  if (/^SM-/.test(m)) return 'samsung';
  if (/^HUAWEI/.test(m) || /^[A-Z]{3}-[A-Z0-9]{2,6}$/.test(m)) return 'huawei';
  if (/^LE\d{4}/.test(m)) return 'oneplus';
  if (/^(CPH|OPD|PEDM|PGAM|PHT|PHU|PJD|PJA)/.test(m)) return 'oppo';
  if (/^V\d{4}[A-Z]{0,2}$/.test(m)) return 'vivo';
  if (/^M2\d{3}/.test(m) || /^2\d{7}/.test(m)) return cssWidth >= 400 ? 'xiaomi' : 'redmi';
  return '';
}
function brandFromBrowser() {
  var ua = navigator.userAgent;
  if (/SamsungBrowser/.test(ua)) return 'samsung';
  if (/MiuiBrowser|XiaoMi|MIUI/.test(ua)) return cssWidth >= 400 ? 'xiaomi' : 'redmi';
  if (/HuaweiBrowser|HUAWEI|HONOR/.test(ua)) return 'huawei';
  if (/HeyTapBrowser|OppoBrowser/.test(ua)) return 'oppo';
  if (/VivoBrowser/.test(ua)) return 'vivo';
  return '';
}
function modelFromUA() {
  var ua = navigator.userAgent, m;
  if ((m = ua.match(/(SM-[A-Z0-9]+)/))) return m[1];
  if ((m = ua.match(/HUAWEI ([A-Z0-9-]+)/))) return 'HUAWEI ' + m[1];
  if ((m = ua.match(/;\s*((?:LE\d{4}|CPH\d{4}|OPD\d{3,4}|V\d{4}[A-Z]{0,2}|M2\d{3}[A-Z0-9]+|2\d{9,}[A-Z]*|[A-Z]{3}-[A-Z0-9]{2,6}))\s+(?:Build|\))/))) return m[1];
  return '';
}

/* ---------- safe-area insets ---------- */
function safeArea() {
  var el = document.createElement('div');
  el.style.cssText = 'position:fixed;left:-9999px;top:-9999px;' +
    'padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);' +
    'padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);';
  document.body.appendChild(el);
  var cs = getComputedStyle(el);
  var v = ['Top', 'Right', 'Bottom', 'Left'].map(function (s) { return parseFloat(cs['padding' + s]) || 0; });
  document.body.removeChild(el);
  return v;
}

/* ---------- color scheme / gamut / HDR ---------- */
function colorScheme() {
  try {
    if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
    if (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) return 'light';
  } catch (e) {}
  return 'unknown';
}
function colorGamut() {
  try {
    if (matchMedia('(color-gamut: rec2020)').matches) return 'rec2020';
    if (matchMedia('(color-gamut: p3)').matches) return 'p3';
    if (matchMedia('(color-gamut: srgb)').matches) return 'srgb';
  } catch (e) {}
  return 'unknown';
}
function hdrSupport() {
  var r = {};
  try { r.dynamic = matchMedia('(dynamic-range: high)').matches; } catch (e) { r.dynamic = false; }
  try { r.video = matchMedia('(video-dynamic-range: high)').matches; } catch (e) { r.video = false; }
  return r;
}

/* ---------- state ---------- */
var state = {
  platform: getPlatform(),
  browser: getBrowser(),
  model: '',
  brand: '',
  deviceName: '',
  source: '',
  radius: 16,
  exact: false,
  mq: mqSupported(),
  battery: 'checking…'
};

function resolveRadius() {
  var mq = radiusByMQ();
  if (mq !== null && mq > 0) { state.radius = mq; state.exact = true; state.source = 'CSS media query'; return; }
  if (state.platform === 'iOS (iPhone)') {
    var est = radiusByIOSSize();
    if (est !== null) { state.radius = est; state.exact = false; state.source = 'iOS screen-size table'; return; }
  }
  if (state.platform === 'Android') {
    state.deviceName = '';
    var hit = lookupAndroidModel(state.model);
    if (hit) {
      state.radius = hit.r; state.exact = false;
      state.deviceName = hit.n;
      state.source = 'model database · ' + hit.n; return;
    }
    if (state.brand && BRAND_DEFAULTS[state.brand]) {
      state.radius = BRAND_DEFAULTS[state.brand]; state.exact = false;
      state.source = 'brand default · ' + state.brand; return;
    }
  }
  if (mq === 0) { state.radius = 16; state.exact = false; state.source = 'square screen — default'; return; }
  state.radius = 16; state.exact = false;
  state.source = state.platform === 'Android' ? 'not detected — default' : 'default';
}

/* ---------- corner shape ----------
   Modern phone screens (Xiaomi/Redmi included, like iPhone) use
   continuous-curvature "squircle" corners, not quarter-circle arcs.
   The radius values below are base radii; `corner-shape: squircle`
   approximates the same curve where the browser supports it. */
function cornerShapeSupported() {
  try { return !!(window.CSS && CSS.supports && CSS.supports('corner-shape', 'squircle')); }
  catch (e) { return false; }
}

/* ---------- render ---------- */
function render() {
  var dpr = window.devicePixelRatio || 1;
  var sa = safeArea();
  var hdr = hdrSupport();
  var modelText = state.model
    ? (state.deviceName ? state.model + ' · ' + state.deviceName : state.model)
    : (state.platform === 'Android' ? '(detecting…)' : 'not exposed');

  var rows = [
    ['Platform', state.platform],
    ['Browser', state.browser],
    ['Model', modelText],
    ['Screen', screen.width + ' × ' + screen.height + ' px @ ' + dpr + 'x'],
    ['Safe-area t/r/b/l', sa[0] + ' / ' + sa[1] + ' / ' + sa[2] + ' / ' + sa[3] + ' px'],
    ['radius media query', state.mq ? 'supported' : 'not supported'],
    ['Corner shape', cornerShapeSupported()
      ? 'squircle (continuous curvature)'
      : 'circular (browser fallback)'],
    ['Source', state.source || '—'],
    ['Corner radius', (state.exact ? '' : '~') + state.radius + ' px — ' + (state.exact ? 'exact' : 'estimated/default')],
    ['Color scheme', colorScheme() + ' (system)'],
    ['Color gamut', colorGamut()],
    ['HDR', (hdr.dynamic ? 'dynamic-range: high' : 'dynamic-range: no') +
            (hdr.video ? ' · video: high' : '') +
            ' · ' + (screen.colorDepth || '?') + '-bit'],
    ['WebGPU HDR', state.webgpu],
    ['Battery', state.battery]
  ];
  document.getElementById('info').innerHTML =
    rows.map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('');

  document.documentElement.style.setProperty('--device-radius', state.radius + 'px');
  document.getElementById('summary').innerHTML =
    'Applied corner radius: <b>' + (state.exact ? '' : '~') + state.radius + 'px</b> (' +
    (state.exact ? 'exact' : 'estimated') + ')';
  document.getElementById('sheetInfo').textContent =
    'bottom corners: ' + state.radius + '−12 = ' + Math.max(state.radius - 12, 0) +
    'px · buttons: ' + (state.radius * 0.45).toFixed(1) + 'px';
  document.body.style.paddingBottom = (document.getElementById('sheet').offsetHeight + 20) + 'px';
}

/* ---------- WebGPU HDR canvas ----------
   Canvas: rgba16float + display-p3 + tone-mapping "extended" lets the shader
   output values above 1.0 that the display shows brighter than SDR white.
   Content is laid out on a 2D canvas first and uploaded as a texture:
     red channel   = HDR patch  -> shader gain 10x
     green channel = HDR words  -> shader gain 5x
     blue channel  = normal text                                    */
var HDR_SHADER = ''
  + '@group(0) @binding(0) var samp: sampler;\n'
  + '@group(0) @binding(1) var tex: texture_2d<f32>;\n'
  + 'struct VOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f };\n'
  + '@vertex fn vs(@builtin(vertex_index) vi: u32) -> VOut {\n'
  + '  var pts = array<vec2f,3>(vec2f(-1.0, -3.0), vec2f(-1.0, 1.0), vec2f(3.0, 1.0));\n'
  + '  var o: VOut;\n'
  + '  o.pos = vec4f(pts[vi], 0.0, 1.0);\n'
  + '  o.uv = vec2f((pts[vi].x + 1.0) * 0.5, 1.0 - (pts[vi].y + 1.0) * 0.5);\n'
  + '  return o;\n'
  + '}\n'
  + '@fragment fn fs(i: VOut) -> @location(0) vec4f {\n'
  + '  let c = textureSample(tex, samp, i.uv);\n'
  + '  var col = vec3f(0.0052, 0.0052, 0.0070);\n'
  + '  col += c.b * vec3f(0.92);\n'
  + '  col += c.g * vec3f(5.0);\n'
  + '  col += c.r * vec3f(10.0);\n'
  + '  return vec4f(col, 1.0);\n'
  + '}\n';

var HDR_WORDS = [
  { t: 'The', b: false }, { t: 'quick', b: false }, { t: 'brown', b: false },
  { t: 'fox', b: false }, { t: 'jumps', b: false }, { t: 'over', b: false },
  { t: 'the', b: false }, { t: 'lazy', b: false }, { t: 'dog,', b: false },
  { t: 'and', b: false }, { t: 'bright', b: true }, { t: 'text', b: false },
  { t: 'glows', b: false }, { t: 'in', b: false }, { t: 'high', b: true },
  { t: 'dynamic', b: true }, { t: 'range', b: true }, { t: 'above', b: false },
  { t: 'ordinary', b: false }, { t: 'white.', b: false }
];

function buildHdrSource(cssW, mode) {
  var dpr = window.devicePixelRatio || 1;
  var c = document.createElement('canvas');
  var ctx = c.getContext('2d');
  var W = Math.max(1, Math.round(cssW * dpr));
  var pad = Math.round(10 * dpr);
  var patchH = Math.round(24 * dpr);
  var gap = Math.round(9 * dpr);
  var lineH = Math.round(19 * dpr);
  var font = function (b) {
    return (b ? 'bold ' : '') + Math.round(13 * dpr) +
      'px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';
  };
  ctx.font = font(false);
  var space = ctx.measureText(' ').width;
  var lines = [[]], x = 0, maxW = W - 2 * pad;
  for (var i = 0; i < HDR_WORDS.length; i++) {
    ctx.font = font(HDR_WORDS[i].b);
    var w = ctx.measureText(HDR_WORDS[i].t).width;
    if (x > 0 && x + space + w > maxW) { lines.push([]); x = 0; }
    if (x > 0) x += space;
    lines[lines.length - 1].push({ w: HDR_WORDS[i], width: w });
    x += w;
  }
  var H = pad + patchH + gap + lines.length * lineH + pad;
  c.width = W; c.height = H;
  ctx.fillStyle = mode === 'mask' ? '#000' : '#101014';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = mode === 'mask' ? '#f00' : '#555';
  ctx.fillRect(pad, pad, W - 2 * pad, patchH);
  ctx.textBaseline = 'top';
  for (var L = 0; L < lines.length; L++) {
    var tx = pad, ty = pad + patchH + gap + L * lineH;
    for (var j = 0; j < lines[L].length; j++) {
      var wd = lines[L][j].w;
      ctx.font = font(wd.b);
      ctx.fillStyle = mode === 'mask' ? (wd.b ? '#0f0' : '#00f') : (wd.b ? '#fff' : '#c9c9cf');
      ctx.fillText(wd.t, tx, ty);
      tx += lines[L][j].width + space;
    }
  }
  return { canvas: c, cssH: H / dpr };
}

var gpuDevice = null, lastHdrW = 0, hdrRzTimer = null;

async function initHdr() {
  var el = document.getElementById('hdrCanvas');
  if (!el) return;
  var old = document.querySelector('canvas.hdrfb');
  if (old) old.parentNode.removeChild(old);
  el.style.display = 'block';
  var cssW = el.clientWidth || 320;
  lastHdrW = cssW;
  var src = buildHdrSource(cssW, 'mask');
  el.width = src.canvas.width;
  el.height = src.canvas.height;
  el.style.height = src.cssH + 'px';

  var fallback = function (status) {
    state.webgpu = status;
    el.style.display = 'none';
    var fb = buildHdrSource(cssW, 'direct');
    fb.canvas.className = 'hdrfb';
    fb.canvas.style.width = '100%';
    fb.canvas.style.height = fb.cssH + 'px';
    el.parentNode.insertBefore(fb.canvas, el);
    render();
  };

  try {
    if (!navigator.gpu) { fallback('unavailable'); return; }
    var ctx = el.getContext('webgpu');
    if (!ctx) { fallback('unavailable'); return; }
    if (!gpuDevice) {
      var adapter = await navigator.gpu.requestAdapter();
      if (!adapter) { fallback('no adapter'); return; }
      gpuDevice = await adapter.requestDevice();
    }
    var device = gpuDevice;
    var colorSpace = 'display-p3';
    try {
      ctx.configure({ device: device, format: 'rgba16float', alphaMode: 'opaque',
        colorSpace: colorSpace, toneMapping: { mode: 'extended' } });
    } catch (e1) {
      colorSpace = 'srgb';
      ctx.configure({ device: device, format: 'rgba16float', alphaMode: 'opaque',
        toneMapping: { mode: 'extended' } });
    }
    var tm = 'unknown';
    if (ctx.getConfiguration) {
      var gc = ctx.getConfiguration();
      tm = (gc && gc.toneMapping && gc.toneMapping.mode === 'extended') ? 'extended' : 'standard';
    }
    var tex = device.createTexture({
      size: [src.canvas.width, src.canvas.height],
      format: 'rgba8unorm',
      usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT
    });
    device.queue.copyExternalImageToTexture(
      { source: src.canvas }, { texture: tex }, [src.canvas.width, src.canvas.height]);
    var sampler = device.createSampler({ magFilter: 'linear', minFilter: 'linear' });
    var module = device.createShaderModule({ code: HDR_SHADER });
    var pipeline = device.createRenderPipeline({
      layout: 'auto',
      vertex: { module: module, entryPoint: 'vs' },
      fragment: { module: module, entryPoint: 'fs', targets: [{ format: 'rgba16float' }] }
    });
    var bind = device.createBindGroup({
      layout: pipeline.getBindGroupLayout(0),
      entries: [{ binding: 0, resource: sampler }, { binding: 1, resource: tex.createView() }]
    });
    var enc = device.createCommandEncoder();
    var pass = enc.beginRenderPass({
      colorAttachments: [{
        view: ctx.getCurrentTexture().createView(),
        loadOp: 'clear', clearValue: { r: 0.0052, g: 0.0052, b: 0.007, a: 1 }, storeOp: 'store'
      }]
    });
    pass.setPipeline(pipeline);
    pass.setBindGroup(0, bind);
    pass.draw(3);
    pass.end();
    device.queue.submit([enc.finish()]);
    state.webgpu = 'rgba16float · ' + colorSpace + ' · tone-mapping: ' + tm;
    render();
  } catch (e) {
    fallback('error: ' + (e && e.message ? e.message : e));
  }
}

window.addEventListener('resize', function () {
  clearTimeout(hdrRzTimer);
  hdrRzTimer = setTimeout(function () {
    var el = document.getElementById('hdrCanvas');
    var w = el ? (el.clientWidth || 0) : 0;
    if (el && Math.abs(w - lastHdrW) > 40) initHdr();
  }, 200);
});

/* ---------- init ---------- */
resolveRadius();
render();
initHdr();

/* live listeners */
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render); } catch (e) {}
window.addEventListener('resize', render);

/* battery (Chrome / Samsung Internet on Android; not on iOS Safari) */
if (navigator.getBattery) {
  navigator.getBattery().then(function (b) {
    var upd = function () {
      state.battery = Math.round(b.level * 100) + '% · ' + (b.charging ? 'charging' : 'discharging');
      render();
    };
    b.addEventListener('levelchange', upd);
    b.addEventListener('chargingchange', upd);
    upd();
  }).catch(function () { state.battery = 'not exposed'; render(); });
} else {
  state.battery = 'not exposed';
  render();
}

/* Android model detection (UA-CH, then UA string) */
if (state.platform === 'Android') {
  var applyModel = function (model) {
    state.model = model;
    state.brand = model ? brandOfModel(model) : brandFromBrowser();
    resolveRadius();
    render();
  };
  if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
    navigator.userAgentData.getHighEntropyValues(['model'])
      .then(function (info) { applyModel((info && info.model && info.model !== 'K') ? info.model : modelFromUA()); })
      .catch(function () { applyModel(modelFromUA()); });
  } else {
    applyModel(modelFromUA());
  }
}
</script>
</body>
</html>
