<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>屏幕圆角test</title>
<style>
  :root { --bg:#0b0d12; --fg:#e9edf5; --mut:#8b93a7; --acc:#7aa7ff; --ok:#3ddc84; --bad:#ff5a6e; --mid:#ffc857; --line:#232838; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; overscroll-behavior:none; background:var(--bg); color:var(--fg);
    font:13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }

  #probe { position:fixed; left:0; top:0; z-index:0; display:block; }
  #hint { position:fixed; inset:0; z-index:5; display:none; }
  #hint.on { display:block; }

  #hud { position:fixed; inset:0; z-index:10; overflow:auto; -webkit-overflow-scrolling:touch;
    padding:max(10px, env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom));
    background:var(--bg); }
  .top { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
  .top b { font-size:15px; font-weight:600; }
  #status { font-size:11.5px; color:var(--mut); font-variant-numeric:tabular-nums; }
  #status.err { color:var(--bad); }
  #status.ok { color:var(--ok); }

  table { width:100%; border-collapse:collapse; font-size:12px; }
  td { border:1px solid var(--line); padding:4px 7px; vertical-align:top; }
  #auto td:first-child, table.kv td:first-child { width:38%; color:var(--mut); background:#10131c; white-space:nowrap; }
  td code { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:11px; color:#ffd479; }
  b { color:#fff; } .mut { color:var(--mut); }

  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .btn { font:inherit; font-size:13px; padding:9px 14px; border-radius:10px; border:1px solid var(--acc);
    background:var(--acc); color:#0b0d12; font-weight:600; cursor:pointer; }
  .btn.ghost { background:transparent; color:var(--fg); border-color:#39415a; }
  #file { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
  input[type=number] { width:78px; padding:8px; border-radius:9px; border:1px solid var(--line); background:#0e1119; color:var(--fg); font:inherit; }

  #pastebox { display:none; margin-top:8px; min-height:44px; border:1.5px dashed #3b4157; border-radius:10px;
    padding:10px; color:var(--mut); font-size:12px; }
  #pastebox.on { display:block; }

  #result:empty { display:none; }
  .verdict { border-radius:12px; padding:12px 14px; margin-top:12px; border:1px solid var(--line); background:#10131c; }
  .verdict.ok { border-color:rgba(61,220,132,.55); }
  .verdict.mid { border-color:rgba(255,200,87,.55); }
  .verdict.bad { border-color:rgba(255,90,110,.55); }
  .vrow { display:flex; align-items:baseline; gap:6px; }
  .vnum { font-size:38px; font-weight:700; line-height:1.05; color:#fff; font-variant-numeric:tabular-nums; }
  .vunit { color:var(--acc); font-size:15px; font-weight:600; }
  .vlabel { margin-left:8px; font-size:12px; color:#cbd3e4; }
  .vmeta { margin-top:6px; font-size:11.5px; color:var(--mut); }
  h3 { font-size:13px; margin:14px 0 6px; color:#fff; }
  .alert { border-radius:10px; padding:8px 10px; font-size:12px; margin-top:6px;
    background:rgba(255,90,110,.09); border:1px solid rgba(255,90,110,.45); color:#ffc3cb; }
  pre.log { background:#0e1119; border:1px solid var(--line); border-radius:10px; padding:8px 10px;
    font:11px/1.6 ui-monospace, Menlo, Consolas, monospace; color:#9fb0cd; white-space:pre-wrap; word-break:break-all; }
  canvas.overlay { display:block; width:100%; max-width:340px; margin:4px auto; border:1px solid var(--line); border-radius:8px; background:#0b0d12; }
  textarea.json { width:100%; background:#0e1119; color:#9fb0cd; border:1px solid var(--line); border-radius:10px;
    padding:8px; font:11px/1.5 ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>

<canvas id="probe"></canvas>
<div id="hint"></div>

<div id="hud">
  <div class="top"><b>屏幕圆角test</b><span id="status"></span></div>

  <table id="auto"></table>

  <div class="row">
    <label class="btn" for="file">选择图片</label>
    <input type="file" id="file" accept="image/*">
    <button class="btn" id="btnPaste">粘贴</button>
    <button class="btn ghost" id="btnHide">隐藏面板</button>
  </div>

  <div class="row">
    <input type="number" id="manW" inputmode="numeric" placeholder="宽">
    <input type="number" id="manH" inputmode="numeric" placeholder="高">
    <button class="btn ghost" id="btnManual">尺寸</button>
    <button class="btn ghost" id="btnRedraw">重绘</button>
  </div>

  <div id="pastebox" contenteditable="true" spellcheck="false"></div>
  <div id="result"></div>
</div>

<script src="ruler.js"></script>
<script src="app.js"></script>
</body>
</html>
